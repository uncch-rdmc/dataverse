name: "Experiment: Integration Tests + JSF Tests on one instance"

# Experiment only: builds Dataverse once, then runs the Maven integration
# tests and the Playwright JSF suite against the same instance at the same
# time, to find where the two suites get in each other's way.
on:
  workflow_dispatch:
  push:
    branches:
      - jsf-it-combined

concurrency:
  group: "jsf-it-combined-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  main-jsf-tests-workflow:
    name: "ITs + JSF (${{ matrix.browser }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    timeout-minutes: 180

    defaults:
      run:
        shell: bash

    permissions:
      contents: read

    steps:

      # ---------------------------
      # CHECKOUT
      # ---------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
      # ---------------------------
      # VERIFY DOCKER
      # ---------------------------
      - name: Verify Docker
        run: |
          set -euo pipefail
          docker version

      # ---------------------------
      # SETUP JAVA + MAVEN
      # ---------------------------
      - name: Setup Java
        uses: actions/setup-java@v6.0.1
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Verify Maven
        run: |
          set -euo pipefail
          mvn -version

      # ---------------------------
      # FETCH OR BUILD BASE IMAGE
      # ---------------------------
      - name: Fetch or Build local base image
        run: |
          set -euo pipefail
          
          # 1. Ask Maven for the expected tag
          BASE_IMAGE=$(cd modules/container-base && mvn build-helper:parse-version help:evaluate -Dexpression=base.image -q -DforceStdout -Pct)
          echo "Target base image: $BASE_IMAGE"
          
          # 2. Try to pull it. If that fails, build it.
          if docker pull "$BASE_IMAGE"; then
            echo "✅ Image found and pulled successfully! Skipping local build."
          else
            echo "⚠️ Pull failed (image likely doesn't exist yet). Building locally..."
            mvn -Pct clean package -f modules/container-base/pom.xml
          fi

      # ---------------------------
      # BUILD IMAGES (Dataverse-native)
      # ---------------------------
      - name: Build Dataverse containers via Maven
        run: |
          set -euo pipefail
          mvn -Pct -T 1C package

      # ---------------------------
      # START CONTAINERS (BACKGROUND)
      # ---------------------------
      - name: Start Dataverse stack
        run: |
          set -euo pipefail
          mvn -Pct docker:start \
            -Ddataverse.feature.index-harvested-metadata-source=true \
            -Ddataverse.oai.server.maxidentifiers=2 \
            -Ddataverse.oai.server.maxrecords=2 \
            -Ddataverse.feature.allow-locally-fair-data=true

      # ---------------------------
      # WAIT FOR API READINESS
      # ---------------------------
      - name: Wait for Dataverse API readiness
        run: |
          set -euo pipefail
          URL="http://localhost:8080/api/info/version"
          MAX_ATTEMPTS=10
          SLEEP_TIME=15
          echo "Waiting for Dataverse readiness..."
          for attempt in $(seq 1 $MAX_ATTEMPTS); do
            echo "Attempt $attempt..."
            RESPONSE=$(curl -s --max-time 15 "$URL" || true)
            STATUS=$(echo "$RESPONSE" | jq -r '.status' 2>/dev/null || echo "NOT_READY")
            if [ "$STATUS" = "OK" ]; then
              echo "Dataverse endpoint is READY."
              echo "Waiting 30 more seconds for full readiness..."
              sleep 30
              echo "Response: $RESPONSE"
              exit 0
            fi
            echo "Not ready. Sleeping ${SLEEP_TIME}s..."
            sleep $SLEEP_TIME
            if [ $SLEEP_TIME -lt 60 ]; then
              SLEEP_TIME=$((SLEEP_TIME * 2))
              if [ $SLEEP_TIME -gt 60 ]; then
                SLEEP_TIME=60
              fi
            fi
          done
          echo "Dataverse failed to become ready."
          docker ps
          CONTAINERS="$(docker ps -aq)"
          if [ -n "$CONTAINERS" ]; then
            for cid in $CONTAINERS; do
              echo "===== Logs for container $cid ====="
              docker logs "$cid" || true
            done
          else
            echo "No running containers to show logs for."
          fi
          exit 1

      # ---------------------------
      # MAP LOCALSTACK TO LOCALHOST
      # ---------------------------
      - name: Map localstack to localhost for Maven tests
        run: echo "127.0.0.1 localstack" | sudo tee -a /etc/hosts

      # ---------------------------
      # CONFIGURE DATAVERSE FOR TESTS
      # ---------------------------
      - name: Configure Dataverse API Settings
        run: |
          set -euo pipefail

          echo "Setting API Database Settings via internal container curl..."

          declare -A settings=(
            [":BuiltinUsersKey"]="burrito"
            [":ProvCollectionEnabled"]="true"
            [":AllowApiTokenLookupViaApi"]="true"
            [":AllowSignUp"]="true"
          )
          for key in "${!settings[@]}"; do
            echo "Setting $key..."
            docker exec dev_dataverse curl --fail-with-body -sS -X PUT -d "${settings[$key]}" "http://localhost:8080/api/admin/settings/$key"
            echo ""
          done

      # ---------------------------
      # PRE-TEST INJECTIONS
      # ---------------------------
      - name: Put SUSHI config file in place
        run: |
          set -euo pipefail

          SOURCE_FILE="${{ github.workspace }}/src/test/java/edu/harvard/iq/dataverse/makedatacount/sushi_sample_logs.json"

          echo "Injecting local file into container..."
          docker exec -i dev_dataverse sh -c "cat > /tmp/sushi_sample_logs.json" < "$SOURCE_FILE"

          docker exec dev_dataverse ls -l /tmp/sushi_sample_logs.json
          docker exec dev_dataverse head -n 5 /tmp/sushi_sample_logs.json

      # ---------------------------
      # START MAVEN INTEGRATION TESTS (BACKGROUND)
      # ---------------------------
      - name: Start Maven integration tests in the background
        env:
          DVAPIKEY: "burrito"
          DV_APIKEY: "burrito"
          DV_API_KEY: "burrito"
        run: |
          set -euo pipefail
          TEST_SUITE=$(cat tests/integration-tests.txt)
          echo "Starting suite: $TEST_SUITE"
          date -u +"ITs started %Y-%m-%dT%H:%M:%SZ" | tee it-timing.txt
          nohup mvn test \
            -Dtest="$TEST_SUITE" \
            -Dmaven.test.failure.ignore=true \
            -Ddataverse.test.baseurl=http://localhost:8080 \
            -Ddataverse.test.solr.softcommit.millis=100 \
            -DcompilerArgument=-Xlint:unchecked \
            > it.log 2>&1 &
          echo $! > it.pid

      # ---------------------------
      # SETUP NODE.JS
      # ---------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      # ---------------------------
      # CHECKOUT dataverse-jsf-tests
      # ---------------------------
      - name: Checkout dataverse-jsf-tests
        uses: actions/checkout@v7
        with:
          repository: uncch-rdmc/dataverse-jsf-tests
          path: dataverse-jsf-tests

      - name: Install dataverse-jsf-tests dependencies
        run: npm ci
        working-directory: dataverse-jsf-tests

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: dataverse-jsf-tests

      # ---------------------------
      # RUN PLAYWRIGHT FRONTEND TESTS
      # ---------------------------
      - name: Authenticate (${{ matrix.browser }})
        run: npx playwright test --no-deps --reporter=list --project=setup-${{ matrix.browser }}
        working-directory: dataverse-jsf-tests
        env:
          BASE_URL:       "http://localhost:8080"
          LOGIN_ADAPTER:  "builtin"
          DV_USERNAME:    "dataverseAdmin"
          DV_PASSWORD:    "admin1"
          DV_FULL_NAME:   "Dataverse Admin"
          ROOT_DATAVERSE: "/dataverse/root"
          SKIP_PREFLIGHT: "true"
          LOCALLY_FAIR_ENABLED: "false"
          DOTENV_CONFIG_QUIET: "true"


      - name: Run Playwright frontend tests (${{ matrix.browser }})
        continue-on-error: true
        run: npx playwright test --no-deps --project=${{ matrix.browser }}
        working-directory: dataverse-jsf-tests
        env:
          BASE_URL:       "http://localhost:8080"
          LOGIN_ADAPTER:  "builtin"
          DV_USERNAME:    "dataverseAdmin"
          DV_PASSWORD:    "admin1"
          DV_FULL_NAME:   "Dataverse Admin"
          ROOT_DATAVERSE: "/dataverse/root"
          SKIP_PREFLIGHT: "true"
          LOCALLY_FAIR_ENABLED: "false"
          DOTENV_CONFIG_QUIET: "true"

      # ---------------------------
      # WAIT FOR THE INTEGRATION TESTS
      # ---------------------------
      - name: Wait for Maven integration tests
        if: always()
        run: |
          set -uo pipefail
          date -u +"JSF (${{ matrix.browser }}) finished %Y-%m-%dT%H:%M:%SZ" | tee -a it-timing.txt
          PID=$(cat it.pid)
          while kill -0 "$PID" 2>/dev/null; do sleep 30; done
          date -u +"ITs finished %Y-%m-%dT%H:%M:%SZ" | tee -a it-timing.txt
          echo "===== Integration test summary ====="
          grep -a -E "Tests run:.*(Failures: [1-9]|Errors: [1-9])|Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$|BUILD|Total time" it.log || true

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maven-test-reports-${{ matrix.browser }}
          path: |
            it.log
            it-timing.txt
            target/surefire-reports/
          retention-days: 14

      # ---------------------------
      # UPLOAD PLAYWRIGHT REPORT
      # ---------------------------
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: dataverse-jsf-tests/playwright-report/
          retention-days: 14

      # ---------------------------
      # COLLECT DOCKER LOGS (ALWAYS)
      # ---------------------------
      - name: Collect Docker logs (mapped)
        if: always()
        run: |
          mkdir -p docker-logs
          echo "Gathering container metadata..."
          docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' > docker-logs/container-summary.txt
          while IFS='|' read -r name image status; do
            label="$name"
            case "$name" in
              *dataverse*) label="dataverse-app" ;;
              *postgres*)  label="postgres-db" ;;
              *solr*)      label="solr-index" ;;
              *localstack*)label="localstack-s3" ;;
            esac
            echo "Collecting logs for $name ($label)"
            {
              echo "===== CONTAINER: $name ====="
              echo "Label: $label"
              echo "Image: $image"
              echo "Status: $status"
              echo ""
              echo "===== LOGS ====="
              docker logs --timestamps "$name" 2>&1 || true
            } > "docker-logs/${label}__${name}.log"
          done < docker-logs/container-summary.txt

      # ---------------------------
      # UPLOAD DOCKER LOGS (ALWAYS)
      # ---------------------------
      - name: Upload Docker logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: docker-logs-${{ matrix.browser }}
          path: docker-logs/
          retention-days: 14
